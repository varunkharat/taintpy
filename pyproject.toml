[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "taintpy"
version = "0.4.0"
description = "Taint-tracking static analyzer for Python injection bugs"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Varun Kharat" }]
keywords = ["security", "static-analysis", "taint", "injection", "sast"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "httpx>=0.24"]
web = ["fastapi>=0.100", "uvicorn>=0.20"]

[project.urls]
Homepage = "https://github.com/varunkharat/taintpy"

[project.scripts]
taintpy = "taintpy.cli:main"
taintpy-web = "taintpy.web.app:main"

[tool.setuptools]
packages = ["taintpy", "taintpy.web"]

[tool.setuptools.package-data]
"taintpy.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
