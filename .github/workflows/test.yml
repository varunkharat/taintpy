name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Unit tests
        run: python -m pytest -q
      - name: Benchmark scan (exit 1 is expected, the fake app is vulnerable)
        run: |
          taintpy --interproc --format json tests/fake_app > findings.json || true
          python -c "import json; d=json.load(open('findings.json')); assert d['count'] == 21, d['count']"
