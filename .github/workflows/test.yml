name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev,web]"
      - name: Unit tests
        run: python -m pytest -q
      - name: Fixture scan (exit 1 is expected, the fake app is vulnerable)
        shell: bash
        run: |
          taintpy --format json -o findings.json tests/fake_app || true
          python -c "import json; d=json.load(open('findings.json')); assert d['count'] == 21, d['count']"
      - name: Self-scan has no findings
        run: taintpy taintpy
